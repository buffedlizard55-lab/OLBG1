# T257E final integration: keep T61 reproducible without a competing publisher.
# The original root is retained at archive/root-20261022; data/release and its
# scripts/tests are unchanged. current-pages.yml is the sole canonical workflow.
name: Archived T61 research checks

'on':
  workflow_dispatch:
    inputs:
      refresh:
        description: Refresh historical T61 inputs in this disposable check job
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: evidence-pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Refresh only the supported official JSON inputs
        if: inputs.refresh
        run: python3 scripts/release_fetch.py
      - name: Build with the actual UTC cutoff
        run: python3 scripts/release_build.py
      - name: Inventory repository files and review locations
        run: python3 scripts/release_inventory.py
      - name: Validate evidence roles, models, freshness and site links
        run: python3 scripts/release_validate.py
      - name: Run canonical and preserved audit tests
        run: python3 -m unittest discover -s tests -p 'test*.py' -v

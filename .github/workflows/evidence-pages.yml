name: Evidence-first dashboard

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      refresh:
        description: Refresh the supported official NHL/MLB JSON collectors
        type: boolean
        default: true
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read

concurrency:
  group: evidence-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Refresh only the supported official JSON inputs
        if: github.event_name == 'schedule' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.refresh)
        run: python3 scripts/release_fetch.py
      - name: Build with the actual UTC cutoff
        run: python3 scripts/release_build.py
      - name: Inventory repository files and review locations
        run: python3 scripts/release_inventory.py
      - name: Validate evidence roles, models, freshness and site links
        run: python3 scripts/release_validate.py
      - name: Run canonical and preserved audit tests
        run: python3 -m unittest discover -s tests -p 'test*.py' -v
      - name: Stage public static files, never Git or dependencies
        run: python3 scripts/release_package.py
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .output/site
          retention-days: 3

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: validate-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Read Pages configuration
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy validated static artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

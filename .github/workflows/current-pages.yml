name: Canonical research checks and Pages

'on':
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 */3 * * *'

permissions:
  contents: read

concurrency:
  group: canonical-research-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Evidence, model, site and browser gates
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Read the pinned revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Evidence and modeling unit tests
        run: python -m unittest discover -s tests/pipeline -v
      - name: Historical structural gate (not factual recertification)
        run: python scripts/validate.py
      - name: Refresh official public feeds; preserve failures as gaps
        if: github.event_name != 'pull_request'
        run: python -m pipeline.refresh --timeout 10
      - name: Build one canonical site and preserve all archives
        run: python -m pipeline.build --out _site
      - name: Field integrity, price arithmetic, source links and fragments
        run: python -m pipeline.validate --site _site
      - name: Install pinned browser-test tooling (no production dependencies)
        run: npm install --prefix "$RUNNER_TEMP/olbg-browser" --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright-core@1.55.0 @sparticuz/chromium@138.0.2
      - name: Desktop, mobile, project-prefix and expiry browser gates
        env:
          NODE_PATH: ${{ runner.temp }}/olbg-browser/node_modules
        run: node tests/pipeline/browser.cjs
      - name: Publish deployment evidence summary
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          s=json.load(open('_site/data/current/snapshot.json'))
          print('## Canonical evidence-first release')
          print('Generated:',s['generated_at'])
          print('Coverage remains partial. Missing data never becomes an invented fact or High pick.')
          for key,value in s['counts'].items(): print(f'- {key}: {value}')
          print('Network attempt ledger: published at data/current/network.json; captures retain original observation times.')
          PY
      - name: Stage verified static artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site

  deploy:
    name: Publish canonical GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy only the tested artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
